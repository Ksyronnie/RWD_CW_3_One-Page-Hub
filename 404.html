<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nie znaleziono strony – Puls Digital.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#24241F">
  <title>404 – Nie znaleziono strony – Puls Digital</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <!-- Header wspólny dla wszystkich podstron; dodawany przez main.js -->
  <div id="site-header"></div>

  <main class="error-page d-flex flex-column align-items-center justify-content-center text-center" style="background-image: radial-gradient(circle at 50% 40%, rgba(72, 249, 237, 0.10), transparent 60%);">
    <div class="container">
      <p class="error-code" aria-hidden="true">404</p>
      <h1 class="section-title">Nie znaleziono strony</h1>
      <p class="text-soft error-text mx-auto">Strona, której szukasz, mogła zostać przeniesiona lub usunięta. Sprawdź, czy adres został wpisany poprawnie, albo skorzystaj z wyszukiwarki poniżej.</p>

      <form class="error-search mx-auto" action="blog.html" method="get" role="search">
        <label for="errorQuery" class="visually-hidden">Szukaj w serwisie</label>
        <div class="input-group">
          <input type="search" class="form-control" id="errorQuery" name="q" placeholder="Czego szukasz?" required>
          <button class="btn btn-cta" type="submit"><i class="bi bi-search" aria-hidden="true"></i><span>Szukaj</span></button>
        </div>
      </form>

      <div class="d-flex flex-wrap justify-content-center gap-2 mt-4">
        <a href="index.html" class="btn btn-cta"><i class="bi bi-house" aria-hidden="true"></i><span>Wróć do strony głównej</span></a>
        <a href="sklep.html" class="btn btn-ghost"><i class="bi bi-bag" aria-hidden="true"></i> Przejdź do sklepu</a>
        <a href="kontakt.html" class="btn btn-ghost"><i class="bi bi-envelope" aria-hidden="true"></i> Skontaktuj się z nami</a>
      </div>
    </div>
  </main>

  <!-- Footer wspólny dla wszystkich podstron; dodawany przez main.js -->
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="main.js"></script>
  <script>
    dodajHeader();
    dodajFooter();
  </script>
</body>
</html>
